<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>JNFeith</title>
		<link rel="icon" type="image/icon" href="/img/flavico.svg"/>
		<link rel="stylesheet" href="../css/styles.css">
		<script src="../includes.js"></script>
		<script src="/feed.js"></script>
	</head>

	<body>
		<div include-html="header.html"></div>
		<main>
			<div class="pageHead">
				<img src="../img/Headers/Blog.webp" alt="notebook"></img>
				<span>Blog</span>
			</div>
			<h1>Blog <a href="/feed.xml" title="Kopiëer RSS link"><img src="/img/icons/rss-logo.svg" id="rss-button"></a></h1>
			
			<p>All blog posts can be found on this page. Currently only available in Dutch.</p>
			<div id="feed-box"></div>
			<noscript>ERROR! JavaScript is required to load the blog posts.</noscript>
			<p>The code that displays this RSS feed is based on code written by <a href="https://cybrkyd.com/post/a-simple-html-rss-feed-reader-and-aggregator-with-javascript/" title="Bezoek website">Cybrkyd</a>.</p>
		</main>
		<script>
			includeHTML();
			loadBlogPosts(10);

			function copyToClipboard(link){
				var inputc = document.body.appendChild(document.createElement("input"));
				inputc.value = link;
				inputc.focus();
				inputc.select();
				document.execCommand('copy');
				inputc.parentNode.removeChild(inputc);
				alert("RSS link Copied.");
			}
		</script>
	</body>
 </html>
