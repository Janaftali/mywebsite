 <!DOCTYPE html>
 <html>
	<head>
		<title>JNFeith</title>
		<link rel="icon" type="image/icon" href="../img/Title_image.ico"/>
		<link rel="stylesheet" href="../styles.css">
		<script src="../includes.js"></script>
		<script src="https://forminit.com/sdk/v1/forminit.js"></script>
	</head>
	<body>
		<div include-html="header.html"> </div>

		<article>
			<div class="pageHead">
				<img src="../img/Headers/Contact.webp" alt="paper airplane"></img>
				<h1>Contact</h1>
			</div>
			<h1>Neem contact op</h1>
			<p>Vul je gegevens in om contact met mij op te nemen. Om privacyredenen deel ik geen adres, telefoon of mailadres, maar via dit formulier kun je mij een mail sturen.</p>
			<div class="container">
				<form id="contact-form" enctype="multipart/form-data">

				<!-- sender: who submitted the form -->
				<input name="fi-sender-firstName" placeholder="First name" />

				<!-- text: free-form answer, no validation -->
				<textarea name="fi-text-message" placeholder="Message"></textarea>
				<!-- email: a second email beyond the sender's -->
				<input type="email" name="fi-email-invitee" placeholder="Invitee email" />
				<!-- tracking: auto-captured by the SDK from URL params and referrer -->

				<button type="submit">Send</button>
				<p id="form-status"></p>
				</form>
			</div> 
		</article>
		<script>
			const forminit = new Forminit();
			const FORM_ID = "94q3rdzq4qs";

			document.getElementById("contact-form").addEventListener("submit", async (e) => {
				e.preventDefault();

				const formData = new FormData(e.target);
				const { data, error } = await forminit.submit(FORM_ID, formData);

				const status = document.getElementById("form-status");

				if (error) {
				status.textContent = error.message;
				return;
				}

				status.textContent = "Message sent successfully!";
				e.target.reset();
			});
		</script>

		<script> includeHTML(); </script>
	</body>
 </html>
