			<h1>Neem contact op</h1>
			<p>Vul je gegevens in om contact met mij op te nemen. Om privacyredenen deel ik geen adres, telefoon of mailadres, maar via dit formulier kun je mij een mail sturen.</p>
			<div class="container">
			  	<form action="form-process.php" method="POST" class="formcarry-form">

					<input type="text" id="name" name="fullName" required />

					<label for="email">Your Email Address</label>
					<input type="email" id="email" name="email" required />

					<label for="message">Your Message</label>
					<textarea name="message" id="message" cols="30" rows="10"></textarea>

					<button type="submit">Send</button>
				</form>
