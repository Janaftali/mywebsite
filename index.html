<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=/nl/" />
  <script>
    (function () {
      const supported = {
        'en': '/en/home.html',
        'nl': '/nl/home.html'
      };

      const lang = (navigator.language || '').toLowerCase(); // e.g. "en-US", "nl-NL", "de-DE"

      const exact = supported[lang];
      const primary = lang.split('-')[0];
      const prefix = supported[primary];

      // Default to Dutch if no match is found
      const target = exact || prefix || supported.nl;

      window.location.replace(target);
    })();
  </script>
</head>
