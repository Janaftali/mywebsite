<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>JNFeith</title>
		<link rel="icon" type="image/icon" href="/img/flavico.svg"/>
		<link rel="stylesheet" href="../css/styles.css">
		<script src="../includes.js"></script>
		<script src="/feed.js"></script>
	</head>

	<body>
		<div include-html="header.html"> </div>
		<main>
			<div class="pageHead">
				<img src="../img/Headers/Blog.webp" alt="notebook"></img>
				<h1>Blog</h1>
			</div>
			<article>
				<h1>Blog</h1>
				<p>Op deze pagina zijn alle blogposts te vinden. <button onclick="copyToClipboard('https:\/\/jnfeith.nl/feed.xml')"><b>Kopiëer RSS link <img src="/img/icons/rss-logo.svg" style="color: white; background-color: orange; padding: 4px; border-radius: 4px;" height="25px"></b></button></p>
				
				<div id="feed-box"></div>
			</article>
		</main>
		<script>
			includeHTML();
			loadBlogPosts(10);

			function copyToClipboard(link){
				var inputc = document.body.appendChild(document.createElement("input"));
				inputc.value = link;
				inputc.focus();
				inputc.select();
				document.execCommand('copy');
				inputc.parentNode.removeChild(inputc);
				alert("RSS link Gekopiëerd.");
			}
		</script>
	</body>
 </html>
