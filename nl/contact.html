 <!DOCTYPE html>
 <html>
	<head>
		<title>JNFeith</title>
		<link rel="icon" type="image/icon" href="../img/icons/Title_image.ico"/>
		<link rel="stylesheet" href="../css/styles.css">
		<script src="../includes.js"></script>
		<script src="https://forminit.com/sdk/v1/forminit.js"></script>
	</head>
	<body>
		<div include-html="header.html"> </div>
		<div class="pageHead">
			<img src="../img/Headers/contact.gif" alt="paper airplane" id="contact"></img>
			<h1>Contact</h1>
		</div>
		<article>
			
			<h1>Neem contact op</h1>
			<p>Vul je gegevens in om contact met mij op te nemen. Om privacyredenen deel ik geen adres, telefoon of mailadres, maar via dit formulier kun je mij een mail sturen.</p>
			<div class="container">
				<form id="contact-form" enctype="multipart/form-data">
					<input name="fi-sender-firstName" placeholder="Naam" />
					<input type="email" name="fi-email" placeholder="Email" />
					<textarea name="fi-text-message" placeholder="Bericht"></textarea>
					<button type="submit">Verstuur</button>
					<p id="form-status"></p>
				</form>
			</div> 
		</article>
		<script>
			const forminit = new Forminit();
			const FORM_ID = "94q3rdzq4qs";

			document.getElementById("contact-form").addEventListener("submit", async (e) => {
				e.preventDefault();

				const formData = new FormData(e.target);
				const { data, error } = await forminit.submit(FORM_ID, formData);

				const status = document.getElementById("form-status");

				if (error) {
				status.textContent = error.message;
				return;
				}

				status.textContent = "Bericht succesvol verstuurd!";
				e.target.reset();
			});
		</script>

		<script> 
			includeHTML(); 
			restartGIF('logo'); 
			restartGIF('contact');
		</script>
	</body>
 </html>
